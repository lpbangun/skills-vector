  <title>Skills Vector · Design concepts</title>
  <style>
    :root {
      --ink: #172033;
      --muted: #667385;
      --line: #c4ced8;
      --workspace: #e8eef2;
      --panel: #fbfcfd;
      --cyan: #2f8fa8;
    }
    body {
      margin: 0;
      font-family: "IBM Plex Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
      background: var(--workspace);
      color: var(--ink);
      line-height: 1.5;
    }
    main {
      max-width: 640px;
      margin: 0 auto;
      padding: 48px 20px;
    }
    h1 {
      font-size: 28px;
      letter-spacing: -0.02em;
      margin: 0 0 8px;
    }
    p {
      margin: 0 0 24px;
      color: var(--muted);
    }
    ol {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 10px;
    }
    a {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      min-height: 44px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--ink);
      text-decoration: none;
    }
    a:hover { border-color: var(--cyan); }
    a:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px #d7eef4, 0 0 0 5px var(--cyan);
    }
    .id {
      font-family: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.04em;
    }
    .name { font-weight: 600; }
  </style>
