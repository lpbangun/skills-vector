[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skills-vector"
version = "0.2.0"
description = "Private-first local occupational intelligence MVP"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "langgraph>=1.0,<2",
  "uvicorn>=0.34,<1",
]

[project.scripts]
skills-vector = "skills_vector.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
skills_vector = ["templates/*.html", "static/*.css", "static/*.js"]
