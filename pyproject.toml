[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "skills-vector"
version = "0.2.0"
description = "Evidence-based occupational skills reference for U.S. startup roles"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.0,<2",
  "mcp>=2.2,<3",
]

[dependency-groups]
dev = [
  "playwright==1.55.0",
]

[project.scripts]
skills-vector = "skills_vector.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
skills_vector = ["fixtures/*.json", "fixtures/*.md"]
