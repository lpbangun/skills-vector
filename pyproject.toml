[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skills-vector"
version = "0.1.0"
description = "Private-first occupational intelligence workflow foundation"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.0,<2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

